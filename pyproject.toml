[project]
name = "agent-obsidian-memory"
version = "0.1.0"
description = "Local-first shared memory for Pi and Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruamel-yaml>=0.18.0,<0.19",
]

[project.scripts]
memory = "agent_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
